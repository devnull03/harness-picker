name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: hpick-windows-x86_64.exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: hpick-linux-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: hpick-macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y musl-tools
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release --target ${{ matrix.target }}
      - shell: bash
        run: cp target/${{ matrix.target }}/release/hpick$([ "$RUNNER_OS" = Windows ] && echo .exe) ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.asset }}", path: "${{ matrix.asset }}" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - run: gh release create "$GITHUB_REF_NAME" hpick-* --repo "$GITHUB_REPOSITORY" --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }

  packages:
    needs: release
    runs-on: ubuntu-latest
    env: { TOKEN: "${{ secrets.PACKAGES_TOKEN }}" }
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: homebrew tap + scoop bucket
        run: |
          v=${GITHUB_REF_NAME#v}
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone -q "https://x-access-token:$TOKEN@github.com/devnull03/homebrew-tap" tap
          f=tap/Formula/harness-picker.rb
          sed -i -E "s/[0-9]+\.[0-9]+\.[0-9]+/$v/g" $f
          sed -i "/hpick-macos-arm64/{n;s/sha256 \".*\"/sha256 \"$(sha hpick-macos-arm64)\"/}" $f
          sed -i "/hpick-linux-x86_64/{n;s/sha256 \".*\"/sha256 \"$(sha hpick-linux-x86_64)\"/}" $f
          git -C tap commit -qam "harness-picker $v" && git -C tap push -q
          git clone -q "https://x-access-token:$TOKEN@github.com/devnull03/scoop-bucket" bucket
          j=bucket/bucket/harness-picker.json
          jq --indent 4 --arg v "$v" --arg h "$(sha hpick-windows-x86_64.exe)" \
            '.version = $v | .hash = $h | .url = (.autoupdate.url | split("$version") | join($v))' $j > tmp.json
          mv tmp.json $j
          git -C bucket commit -qam "harness-picker $v" && git -C bucket push -q
      # ponytail: fails until devnull03.HarnessPicker's first version is merged into winget-pkgs
      - uses: vedantmgoyal9/winget-releaser@v2
        continue-on-error: true
        with:
          identifier: devnull03.HarnessPicker
          installers-regex: 'hpick-windows-x86_64\.exe$'
          token: ${{ secrets.PACKAGES_TOKEN }}
